apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: gcr.io/cloud-devops-shopping-website/order-service:latest
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - port: 3003
    targetPort: 3003


  env:
  - name: RABBIT_HOST
    value: "rabbitmq"
  - name: RABBIT_PORT
    value: "5672"
  - name: RABBIT_USER
    value: "guest"
  - name: RABBIT_PASS
    value: "guest"

